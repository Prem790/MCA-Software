name: Engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: mca_test
          POSTGRES_DB: mca_workspace_e2e_ci
          # Disposable CI database, reachable only through the runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U mca_test -d mca_workspace_e2e_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: foundation
      APP_URL: https://build.example.test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:workspace
        env:
          WORKSPACE_TEST_DATABASE_URL: postgresql://mca_test@127.0.0.1:5432/mca_workspace_e2e_ci
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan source for secrets
        run: |
          mkdir "$RUNNER_TEMP/mca-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/mca-source"
          docker run --rm -v "$RUNNER_TEMP/mca-source:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 dir /repo --config /repo/config/gitleaks.toml --redact --no-banner
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build container without publishing
        run: docker build --tag mca-software:ci .
